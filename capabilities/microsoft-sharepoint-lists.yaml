naftiko: 1.0.0-alpha2
info:
  label: SharePoint REST API — Lists
  description: 'SharePoint REST API — Lists. 4 operations. Lead operation: List all lists on the site. Self-contained Naftiko
    capability covering one Microsoft Sharepoint business surface.'
  tags:
  - Microsoft Sharepoint
  - Lists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_SHAREPOINT_API_KEY: MICROSOFT_SHAREPOINT_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft-sharepoint-lists
    baseUri: https://{tenant}.sharepoint.com/_api
    description: SharePoint REST API — Lists business capability. Self-contained, no shared references.
    resources:
    - name: web-lists
      path: /web/lists
      operations:
      - name: getlists
        method: GET
        description: List all lists on the site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createlist
        method: POST
        description: Create a list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: web-lists-getbytitle('{listTitle}')
      path: /web/lists/getbytitle('{listTitle}')
      operations:
      - name: getlistbytitle
        method: GET
        description: Get list by title
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletelist
        method: DELETE
        description: Delete list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_SHAREPOINT_API_KEY}}'
  exposes:
  - type: rest
    namespace: microsoft-sharepoint-lists-rest
    port: 8080
    description: REST adapter for SharePoint REST API — Lists. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/web/lists
      name: web-lists
      description: REST surface for web-lists.
      operations:
      - method: GET
        name: getlists
        description: List all lists on the site
        call: microsoft-sharepoint-lists.getlists
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlist
        description: Create a list
        call: microsoft-sharepoint-lists.createlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/web/lists/getbytitle-listtitle
      name: web-lists-getbytitle-listtitle
      description: REST surface for web-lists-getbytitle('{listTitle}').
      operations:
      - method: GET
        name: getlistbytitle
        description: Get list by title
        call: microsoft-sharepoint-lists.getlistbytitle
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletelist
        description: Delete list
        call: microsoft-sharepoint-lists.deletelist
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: microsoft-sharepoint-lists-mcp
    port: 9090
    transport: http
    description: MCP adapter for SharePoint REST API — Lists. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-lists-site
      description: List all lists on the site
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-sharepoint-lists.getlists
      outputParameters:
      - type: object
        mapping: $.
    - name: create-list
      description: Create a list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft-sharepoint-lists.createlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-list-title
      description: Get list by title
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-sharepoint-lists.getlistbytitle
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-list
      description: Delete list
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: microsoft-sharepoint-lists.deletelist
      outputParameters:
      - type: object
        mapping: $.
